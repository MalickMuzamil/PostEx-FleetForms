<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
          <h4 class="mb-1 fw-semibold">Login</h4>
          <p class="text-muted mb-4">Enter your email to receive an OTP.</p>

          <form [formGroup]="form" (ngSubmit)="submit()">
            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">Email</label>
              <div class="input-group">
                <span class="input-group-text">
                  <!-- optional icon -->
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    viewBox="0 0 16 16">
                    <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v.217l-8 4.8-8-4.8V4z" />
                    <path
                      d="M0 5.383v6.734A2 2 0 0 0 2 14h12a2 2 0 0 0 2-1.883V5.383l-7.555 4.533a1 1 0 0 1-.89 0L0 5.383z" />
                  </svg>
                </span>

                <input type="email" class="form-control" placeholder="name@example.com" formControlName="email"
                  [class.is-invalid]="form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)" />
              </div>

              <div class="invalid-feedback d-block"
                *ngIf="form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)">
                Please enter a valid email.
              </div>
            </div>

            <!-- Button -->
            <button type="submit" class="btn btn-primary w-100 rounded-3 py-2" [disabled]="loading || form.invalid">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"
                aria-hidden="true"></span>
              {{ loading ? 'Sending...' : 'Send OTP' }}
            </button>

            <div class="text-center mt-3 small text-muted">
              By continuing, you agree to our Terms & Privacy Policy.
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
