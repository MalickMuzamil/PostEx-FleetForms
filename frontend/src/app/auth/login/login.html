<div class="auth-page d-flex align-items-center">
  <div class="container">
    <div class="row align-items-center justify-content-between gx-lg-5 gy-4">

      <!-- Left Content -->
      <div class="col-12 col-lg-5">
        <div class="login-content mx-auto mx-lg-0">
          <h1 class="fw-bold mb-2 login-title">Login to Fleet Forms</h1>
          <p class="text-secondary mb-4 login-subtitle">
            Enter your email to receive an OTP.
          </p>

          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-4">
              <label class="form-label small fw-medium text-dark mb-2">Email</label>
              <input
                type="email"
                class="form-control shadow-none login-input"
                placeholder="Enter Email"
                formControlName="email"
                [class.is-invalid]="form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)"
              />

              <div
                class="invalid-feedback"
                *ngIf="form.get('email')?.invalid && (form.get('email')?.dirty || form.get('email')?.touched)"
              >
                Please enter a valid email.
              </div>
            </div>

            <button
              type="submit"
              class="btn w-100 text-white fw-medium login-btn"
              [disabled]="loading || form.invalid"
            >
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ loading ? 'Sending...' : 'Send OTP' }}
            </button>

            <!-- <button
              *ngIf="passkeyAvailable"
              type="button"
              class="btn btn-outline-secondary w-100 mt-2"
              (click)="continueWithPasskey()"
            >
              Continue with Passkey
            </button> -->

            <p class="small text-secondary mt-3 mb-0 login-terms">
              By continuing, you agree to our
              <a href="#">Terms</a> &
              <a href="#">Privacy Policy</a>.
            </p>
          </form>
        </div>
      </div>

      <!-- Right Image -->
      <div class="col-12 col-lg-6">
        <div class="text-center">
          <img
            src="assets/auth/main.png"
            alt="Truck"
            class="img-fluid login-image"
          />
        </div>
      </div>

    </div>
  </div>
</div>
