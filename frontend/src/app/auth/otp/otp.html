<div class="otp-page d-flex align-items-center">
    <div class="container">
        <div class="row align-items-center justify-content-between gx-lg-5 gy-4">

            <!-- Left -->
            <div class="col-12 col-lg-5">
                <div class="otp-content mx-auto mx-lg-0">

                    <h1 class="otp-title fw-bold mb-2">Verify OTP</h1>

                    <p class="otp-subtitle mb-4">
                        We have sent a code to
                        <span class="otp-email">{{ email }}</span><br />
                        Please enter it below to continue
                    </p>

                    <form [formGroup]="form" (ngSubmit)="verify()">

                        <!-- OTP BOXES -->
                        <div class="d-flex gap-2 gap-sm-3 otp-inputs mb-2">

                            <input *ngFor="let box of otpArray; let i = index" type="text" maxlength="1"
                                inputmode="numeric" autocomplete="one-time-code"
                                class="form-control text-center otp-box" [class.active]="i === activeIndex"
                                [value]="otpValues[i]" (input)="onOtpInput($event, i)"
                                (keydown)="onOtpKeydown($event, i)" (focus)="activeIndex = i"
                                (paste)="onOtpPaste($event)" />

                        </div>

                        <!-- Helper -->
                        <p class="otp-help mb-4">
                            Didn’t receive the code? Check your spam folder.
                        </p>

                        <!-- Verify Button -->
                        <button type="submit" class="btn otp-verify-btn w-100 mb-3"
                            [disabled]="loading || !isOtpComplete()">
                            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                            {{ loading ? 'Verifying...' : 'Verify' }}
                        </button>

                        <!-- Resend -->
                        <button type="button" class="btn otp-resend-btn w-100" (click)="resend()"
                            [disabled]="resendLoading">
                            <span *ngIf="resendLoading" class="spinner-border spinner-border-sm me-2"></span>
                            {{ resendLoading ? 'Resending...' : 'Resend OTP' }}
                        </button>

                    </form>
                </div>
            </div>

            <!-- Right -->
            <div class="col-12 col-lg-6">
                <div class="text-center">
                    <img src="assets/auth/otp.png" alt="OTP Verification" class="img-fluid otp-image" />
                </div>
            </div>

        </div>
    </div>
</div>
