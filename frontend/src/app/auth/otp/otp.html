<div class="auth-page">

    <div class="auth-wrapper">

        <nz-card nzBordered class="auth-card">

            <h2 class="title">OTP Verification</h2>
            <p class="subtitle">Enter the OTP sent to your registered device</p>

            <form nz-form [formGroup]="form" (ngSubmit)="verifyOtp()">

                <!-- OTP -->
                <nz-form-item>
                    <nz-form-label [nzRequired]="true">OTP</nz-form-label>

                    <nz-form-control [nzErrorTip]="'OTP must be 4 to 8 digits'">
                        <input nz-input formControlName="otp" placeholder="Enter OTP" maxlength="8" />
                    </nz-form-control>
                </nz-form-item>

                <!-- Verify Button -->
                <button nz-button nzType="primary" nzSize="large" class="w-100" [nzLoading]="loading">
                    Verify OTP
                </button>

                <!-- Resend -->
                <button nz-button nzType="link" class="w-100 mt-2" type="button" (click)="resend()">
                    Resend OTP
                </button>

            </form>

        </nz-card>

    </div>

</div>
