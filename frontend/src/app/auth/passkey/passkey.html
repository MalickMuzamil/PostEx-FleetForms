<div class="auth-page">
    <div class="auth-wrapper">

        <nz-card nzBordered class="auth-card">

            <div class="header">
                <div class="icon-wrap">
                    <span nz-icon nzType="safety-certificate" nzTheme="outline"></span>
                </div>

                <h2 class="title">Set up Passkey</h2>
                <p class="subtitle">
                    Sign in faster using your device lock (Windows/Mac password, PIN, or biometrics).
                </p>
            </div>

            <nz-alert nzType="info" nzShowIcon class="info-box" nzMessage="How it works"
                nzDescription="If you enable passkey, next time you won’t see OTP. A passkey prompt will open directly. If you skip, login + OTP will continue.">
            </nz-alert>

            <div class="actions">
                <button nz-button nzType="primary" nzSize="large" class="w-100" [nzLoading]="enabling"
                    (click)="enablePasskey()">
                    Enable Passkey
                </button>

                <button nz-button nzType="default" nzSize="large" class="w-100 mt-2" (click)="skipForNow()">
                    Skip for now
                </button>
            </div>

            <div class="footnote">
                <span nz-icon nzType="info-circle" nzTheme="outline"></span>
                <span>Tip: You can enable/disable passkey later from Settings.</span>
            </div>

        </nz-card>

    </div>
</div>
