<nz-modal [nzVisible]="visible" [nzTitle]="title" [nzFooter]="null" [nzMaskClosable]="false" [nzWidth]="720"
    nzWrapClassName="figma-responsive-modal" (nzOnCancel)="handleCancel()">
    <ng-template nzModalContent>
        <app-dynamic-form [config]="formConfig" [data]="data" (submitForm)="handleSubmit($event)"
            (formChange)="formChange.emit($event)" (cancelForm)="handleCancel()">
        </app-dynamic-form>
    </ng-template>
</nz-modal>
