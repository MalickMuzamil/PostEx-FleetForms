<div class="sidebar-backdrop d-lg-none" *ngIf="mobileSidebarOpen" (click)="closeMobileSidebar()">
</div>

<nz-layout class="main-layout">

    <nz-sider class="app-sider" [class.mobile-open]="mobileSidebarOpen"
        [class.desktop-collapsed]="isCollapsed && !mobileSidebarOpen" [nzCollapsed]="false" [nzTrigger]="null"
        [nzWidth]="236">

        <app-sidebar [collapsed]="isCollapsed && !mobileSidebarOpen" [mobileOpen]="mobileSidebarOpen"
            (closeSidebar)="handleSidebarClose()">
        </app-sidebar>

    </nz-sider>

    <nz-layout class="main-right-layout">
        <nz-header>
            <app-header (toggle)="toggleSidebar()"></app-header>
        </nz-header>

        <nz-content class="content">
            <router-outlet></router-outlet>
        </nz-content>
    </nz-layout>

</nz-layout>
