<div class="bulk-page container-fluid mt-3">
  <div class="bulk-card shadow-sm">
    <div class="card-body">

      <!-- TOP BAR -->
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">

        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary bulk-top-btn" routerLink="/call-logs">
            ← Back
          </button>

          <button
            class="btn btn-success bulk-top-btn px-4"
            *ngIf="selectedValidCount >= 1"
            [disabled]="!canProceed"
            (click)="proceedBulkImport()"
          >
            <span *ngIf="bulkSaving" class="spinner-border spinner-border-sm me-2"></span>
            {{ bulkSaving ? 'Processing...' : 'Proceed' }}
          </button>
        </div>

        <h4 class="bulk-title mb-0">Call Logs Bulk Preview</h4>
      </div>

      <!-- LOADER -->
      <nz-spin [nzSpinning]="isLoading" [nzTip]="loadingText">

        <!-- TABLE -->
        <div class="bulk-table-wrap">
          <table class="table bulk-table">

            <!-- HEADER -->
            <thead>
              <tr>
                <th class="col-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    [ngModel]="checkAll"
                    (ngModelChange)="onToggleAll($event)"
                    [disabled]="isLoading"
                  />
                </th>

                <th class="col-index">#</th>
                <th class="col-status">Status</th>

                <th>Customer_Number</th>
                <th>Consignee_Cell_Length</th>
                <th>Master_No</th>
                <th>Agent Duration</th>
                <th>Total Duration</th>
                <th>Extension</th>
                <th>Call_Response</th>
                <th>Time</th>
                <th>Recording</th>
                <th>IsArchived</th>
              </tr>
            </thead>

            <!-- BODY -->
            <tbody>
              <tr
                *ngFor="let row of rows; trackBy: trackByRow"
                [class.row-selected]="row.checked"
              >

                <!-- CHECKBOX -->
                <td>
                  <input
                    type="checkbox"
                    class="form-check-input"
                    [(ngModel)]="row.checked"
                    (change)="onRowToggle(row, row.checked)"
                    [disabled]="isLoading || !row.isValid"
                  />
                </td>

                <!-- INDEX -->
                <td>{{ row.rowNo }}</td>

                <!-- STATUS -->
                <td>
                  <button
                    class="status-pill"
                    [ngClass]="row.isValid ? 'status-valid' : 'status-invalid'"
                    (click)="!row.isValid && showRowErrors(row)"
                  >
                    <span class="pill-dot"></span>
                    {{ row.isValid ? 'Valid' : (row.errors?.length || 0) + ' Errors' }}
                  </button>
                </td>

                <!-- Customer -->
                <td>
                  <div class="cell-wrap" [class.cell-invalid]="hasErrLike(row,'Customer_Number')">
                    <input
                      class="form-control"
                      [(ngModel)]="row.customerNumber"
                      (ngModelChange)="onRowTextChange(row)"
                    />
                  </div>
                </td>

                <!-- Consignee -->
                <td>
                  <div class="cell-wrap" [class.cell-invalid]="hasErrLike(row,'Consignee_Cell_Length')">
                    <input
                      class="form-control"
                      [(ngModel)]="row.consigneeCellLength"
                      (ngModelChange)="onRowTextChange(row)"
                    />
                  </div>
                </td>

                <!-- Master -->
                <td>
                  <div class="cell-wrap" [class.cell-invalid]="hasErrLike(row,'Master_No')">
                    <input
                      class="form-control"
                      [(ngModel)]="row.masterNo"
                      (ngModelChange)="onRowTextChange(row)"
                    />
                  </div>
                </td>

                <!-- Agent Duration -->
                <td>
                  <div class="cell-wrap" [class.cell-invalid]="hasErrLike(row,'Agent Duration')">
                    <input
                      class="form-control"
                      [(ngModel)]="row.agentDuration"
                      (ngModelChange)="onRowTextChange(row)"
                    />
                  </div>
                </td>

                <!-- Total Duration -->
                <td>
                  <div class="cell-wrap" [class.cell-invalid]="hasErrLike(row,'Total Duration')">
                    <input
                      class="form-control"
                      [(ngModel)]="row.totalDuration"
                      (ngModelChange)="onRowTextChange(row)"
                    />
                  </div>
                </td>

                <!-- Extension -->
                <td>
                  <div class="cell-wrap" [class.cell-invalid]="hasErrLike(row,'Extension')">
                    <input
                      class="form-control"
                      [(ngModel)]="row.extension"
                      (ngModelChange)="onRowTextChange(row)"
                    />
                  </div>
                </td>

                <!-- Response -->
                <td>
                  <div class="cell-wrap" [class.cell-invalid]="hasErrLike(row,'Call_Response')">
                    <input
                      class="form-control"
                      [(ngModel)]="row.callResponse"
                      (ngModelChange)="onRowTextChange(row)"
                    />
                  </div>
                </td>

                <!-- TIME -->
                <td>
                  <div class="cell-wrap bulk-date-control" [class.cell-invalid]="hasErrLike(row,'Time')">
                    <nz-date-picker
                      [formControl]="row.timeControl"
                      [nzShowTime]="{ nzFormat: 'HH:mm:ss' }"
                      nzFormat="yyyy-MM-dd HH:mm:ss"
                      (ngModelChange)="onRowTimeChange(row)"
                    >
                    </nz-date-picker>
                  </div>
                </td>

                <!-- RECORDING -->
                <td>
                  <div class="cell-wrap">
                    <input
                      class="form-control"
                      [(ngModel)]="row.recording"
                      (ngModelChange)="onRowTextChange(row)"
                    />
                  </div>
                </td>

                <!-- ARCHIVED -->
                <td>
                  <div class="cell-wrap" [class.cell-invalid]="hasErrLike(row,'IsArchived')">
                    <select
                      class="form-select"
                      [(ngModel)]="row.isArchived"
                      (ngModelChange)="onRowArchivedChange(row)"
                    >
                      <option [ngValue]="0">0</option>
                      <option [ngValue]="1">1</option>
                    </select>
                  </div>
                </td>

              </tr>
            </tbody>
          </table>
        </div>

      </nz-spin>
    </div>
  </div>
</div>
