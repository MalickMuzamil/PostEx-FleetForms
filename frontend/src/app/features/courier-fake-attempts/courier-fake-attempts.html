<app-table [config]="tableConfig" [data]="tableData" (delete)="onDelete($event)">
    <div table-header class="tbl-card-header">
        <h5 class="tbl-card-title">Courier Fake Attempts</h5>

        <button class="tbl-add-btn" (click)="openAddForm()">
            <i class="fa fa-upload"></i>
            Bulk Import
        </button>
    </div>
</app-table>

<app-modal
    [visible]="showModal"
    [title]="formConfig.title"
    [formConfig]="formConfig"
    [data]="data"
    (formChange)="onFormChange($any($event))"
    (cancel)="closeModal()">
</app-modal>
