<app-table [config]="tableConfig" [data]="rows" (delete)="onDelete($event)" (edit)="openEdit($event)">
    <div table-header class="tbl-card-header d-flex justify-content-between align-items-center">
        <h5 class="tbl-card-title mb-0">CnC Definition - L2</h5>

        <button class="tbl-add-btn btn btn-primary btn-sm" (click)="openAdd()">
            <i class="fa fa-plus me-1"></i>
            Add New
        </button>
    </div>
</app-table>

<app-modal
    [visible]="showForm"
    [title]="formConfig.title"
    [formConfig]="formConfig"
    [data]="formData"
    (submit)="onSubmit($event)"
    (cancel)="closeForm()">
</app-modal>
