<app-table [config]="tableConfig" [data]="rows" [loading]="loading" (delete)="onDelete($event)" (edit)="openEdit($event)">
    <div table-header class="tbl-card-header">
        <h5 class="tbl-card-title">CnC Definition - L4</h5>

        <button class="tbl-add-btn" (click)="openAdd()">
            <i class="fa fa-plus"></i>
            Add New
        </button>
    </div>
</app-table>

<app-modal
    [visible]="showForm"
    [title]="formConfig.title"
    [formConfig]="formConfig"
    [data]="formData"
    (submit)="onSubmit($event)"
    (cancel)="closeForm()">
</app-modal>
