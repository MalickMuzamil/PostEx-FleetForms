<app-table [config]="tableConfig" [data]="tableData" [loading]="loading" (edit)="edit($event)" (delete)="delete($event)">
    <div table-header class="tbl-card-header">
        <h5 class="tbl-card-title">Branch &amp; General Employee Bindings</h5>

        <button class="tbl-add-btn" (click)="openAddForm()">
            <i class="fa fa-plus"></i>
            Add Binding
        </button>
    </div>
</app-table>

<app-modal *ngIf="showModal" [visible]="showModal" [title]="formConfig.title" [formConfig]="formConfig" [data]="data"
    (submit)="onSubmit($event)" (cancel)="closeModal()" (formChange)="onFormChange($event)">
</app-modal>
