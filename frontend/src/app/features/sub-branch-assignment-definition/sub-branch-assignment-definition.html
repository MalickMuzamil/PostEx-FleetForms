<app-table [config]="tableConfig" [data]="tableData" (edit)="openEditForm($event)" (delete)="delete($event)">
    <div table-header class="tbl-card-header">
        <h5 class="tbl-card-title">Sub-Branch Assignment Definition</h5>

        <button class="tbl-add-btn" (click)="openAddForm()">
            <i class="fa fa-plus"></i>
            Add Assignment
        </button>
    </div>
</app-table>

<app-modal [visible]="showModal"
    [title]="formConfig.title"
    [formConfig]="formConfig"
    [data]="data"
    (formChange)="onFormChange($any($event))"
    (submit)="onSubmit($event)"
    (cancel)="closeModal()">
</app-modal>
