<app-table #tableRef [config]="tableConfig" [data]="tableData" (edit)="edit($event)" (delete)="delete($event)">
    <div table-header class="tbl-card-header">
        <h5 class="tbl-card-title">Sub-Branch Definition</h5>

        <button class="tbl-add-btn" (click)="openAddForm()">
            <i class="fa fa-plus"></i>
            Add Sub-Branch Binding
        </button>
    </div>
</app-table>

<app-modal [visible]="showModal" [title]="formConfig.title" [formConfig]="formConfig" [data]="data"
    (submit)="onSubmit($event)" (formChange)="onFormChange($any($event))" (cancel)="closeModal()">
</app-modal>
