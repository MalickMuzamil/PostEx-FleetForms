<div class="bulk-page container-fluid mt-3">
  <div class="bulk-card shadow-sm">
    <div class="card-body">

      <!-- TOP -->
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">

        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary bulk-top-btn" routerLink="/branch-wise-calender">
            ← Back
          </button>

          <button class="btn btn-success bulk-top-btn px-4"
            *ngIf="selectedValidCount >= 1"
            [disabled]="!canProceed"
            (click)="proceedBulkImport()">

            <span *ngIf="bulkSaving" class="spinner-border spinner-border-sm me-2"></span>
            {{ bulkSaving ? 'Processing...' : 'Proceed' }}
          </button>
        </div>

        <h4 class="bulk-title mb-0">Branch Wise Calendar Bulk Preview</h4>
      </div>

      <nz-spin [nzSpinning]="isLoading" [nzTip]="loadingText">

        <div class="bulk-table-wrap">
          <table class="table bulk-table">

            <!-- HEADER -->
            <thead>
              <tr>
                <th class="col-check">
                  <input type="checkbox"
                    class="form-check-input"
                    [ngModel]="checkAll"
                    (ngModelChange)="onToggleAll($event)"
                    [disabled]="isLoading" />
                </th>

                <th class="col-action">Action</th>

                <th>#</th>
                <th>Status</th>

                <th>Branch</th>
                <th>Calendar Date</th>
                <th>Is Working</th>
                <th>Description</th>
                <th>IsArchived</th>
              </tr>
            </thead>

            <!-- BODY -->
            <tbody>
              <tr *ngFor="let row of rows; trackBy: trackByRow"
                  [class.row-selected]="row.checked">

                <!-- checkbox -->
                <td>
                  <input type="checkbox"
                    class="form-check-input"
                    [(ngModel)]="row.checked"
                    (change)="onRowToggle(row, row.checked)"
                    [disabled]="isLoading || !row.isValid" />
                </td>

                <!-- delete action -->
                <td>
                  <button type="button" class="btn btn-sm btn-outline-danger" nz-tooltip nzTooltipTitle="Delete row"
                    (click)="deleteRow(row)" [disabled]="isLoading">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <polyline points="3 6 5 6 21 6"></polyline>
                      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                  </button>
                </td>

                <!-- index -->
                <td>{{ row.rowNo }}</td>

                <!-- STATUS -->
                <td>
                  <button
                    class="status-pill"
                    [ngClass]="row.isValid ? 'status-valid' : 'status-invalid'"
                    (click)="!row.isValid && showRowErrors(row)">

                    <span class="pill-dot"></span>
                    {{ row.isValid ? 'Valid' : (row.errors?.length || 0) + ' Errors' }}
                  </button>
                </td>

                <!-- BRANCH -->
                <td>
                  <div class="cell-wrap"
                       [class.cell-invalid]="hasErrLike(row,'BRANCH')">
                    <input class="form-control"
                           [(ngModel)]="row.branch"
                           (ngModelChange)="onRowTextChange(row)" />
                  </div>
                </td>

                <!-- DATE -->
                <td>
                  <div class="cell-wrap bulk-date-control"
                       [class.cell-invalid]="hasErrLike(row,'DATE')">

                    <nz-date-picker
                      nzFormat="yyyy-MM-dd"
                      [formControl]="row.calDateControl"
                      (ngModelChange)="onRowDateChange(row)">
                    </nz-date-picker>

                  </div>
                </td>

                <!-- WORKING -->
                <td>
                  <div class="cell-wrap"
                       [class.cell-invalid]="hasErrLike(row,'ISNOTWORKINGDAY')">

                    <select class="form-select"
                            [(ngModel)]="row.isNotWorkingDay"
                            (ngModelChange)="onRowTextChange(row)">
                      <option [ngValue]="0">0</option>
                      <option [ngValue]="1">1</option>
                    </select>

                  </div>
                </td>

                <!-- DESC -->
                <td>
                  <div class="cell-wrap"
                       [class.cell-invalid]="hasErrLike(row,'NOTWORKINGDAYDESC')">

                    <input class="form-control"
                           [(ngModel)]="row.notWorkingDayDesc"
                           (ngModelChange)="onRowTextChange(row)" />

                  </div>
                </td>

                <!-- ARCHIVED -->
                <td>
                  <div class="cell-wrap"
                       [class.cell-invalid]="hasErrLike(row,'ISARCHIVED')">

                    <select class="form-select"
                            [(ngModel)]="row.isArchived"
                            (ngModelChange)="onRowTextChange(row)">
                      <option [ngValue]="0">0</option>
                      <option [ngValue]="1">1</option>
                    </select>

                  </div>
                </td>

              </tr>
            </tbody>

          </table>
        </div>

      </nz-spin>
    </div>
  </div>
</div>
