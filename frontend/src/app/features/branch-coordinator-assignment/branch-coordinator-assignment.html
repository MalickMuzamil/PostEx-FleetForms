<div>
    <app-table [config]="tableConfig" [data]="tableData" [loading]="loading" (edit)="edit($event)" (delete)="delete($event)">
        <div table-header class="tbl-card-header">
            <h5 class="tbl-card-title">Branch Coordinators</h5>
            <button class="tbl-add-btn" (click)="openAddForm()">
                <i class="fa fa-plus"></i> Add Assignment
            </button>
        </div>
    </app-table>

    <app-modal *ngIf="showModal" [visible]="showModal" [title]="formConfig.title" [formConfig]="formConfig"
        [data]="data" (submit)="onSubmit($event)" (formChange)="onFormChange($any($event))"
        (cancel)="closeModal()"></app-modal>
</div>
